name: Dungeon Co-op Session CI

on:
  push:
    branches:
      - feat/dungeon-coop-websocket

concurrency:
  group: dungeon-coop-session-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Full web tests
        working-directory: web
        run: npm test
      - name: Build web
        working-directory: web
        run: npm run build

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Dungeon relay
        run: go test ./arcade/... ./server
