name: Dungeon Foundation Contracts

on:
  push:
    branches:
      - refactor/dungeon-coop-foundation
      - fix/dungeon-coop-hydration-presentation
    paths:
      - 'web/src/lib/games/dungeon/**'
      - 'web/src/routes/room/[code]/dungeon/+page.svelte'
      - '.github/workflows/dungeon-foundation.yml'
      - 'docs/superpowers/specs/2026-09-16-dungeon-coop-foundation-design.md'
      - 'docs/superpowers/plans/2026-09-16-dungeon-coop-foundation.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run focused Dungeon foundation contracts
        working-directory: web
        run: |
          node --test \
            src/lib/games/dungeon/session-sync-runtime.test.js \
            src/lib/games/dungeon/checkpoint-clock-state.test.js \
            src/lib/games/dungeon/session-gameplay-clock.test.js \
            src/lib/games/dungeon/wire-clock-state.test.js \
            src/lib/games/dungeon/gameplay-capabilities.test.js \
            src/lib/games/dungeon/combat-runtime.test.js \
            src/lib/games/dungeon/combat-slash-ownership.test.js \
            src/lib/games/dungeon/combat-ownership-contract.test.js \
            src/lib/games/dungeon/player-lifecycle-runtime.test.js \
            src/lib/games/dungeon/coop-lifecycle-ownership-contract.test.js \
            src/lib/games/dungeon/network-lifecycle-clock.test.js \
            src/lib/games/dungeon/portal-runtime.test.js \
            src/lib/games/dungeon/coop-portal-ownership-contract.test.js \
            src/lib/games/dungeon/coop-portal-clock.test.js \
            src/lib/games/dungeon/coop-portal-runtime.test.js \
            src/lib/games/dungeon/infinite-portal-ownership-contract.test.js \
            src/lib/games/dungeon/world-portal-ownership-contract.test.js \
            src/lib/games/dungeon/loot-runtime.test.js \
            src/lib/games/dungeon/infinite-loot-policy-contract.test.js \
            src/lib/games/dungeon/loot-world-ownership-contract.test.js \
            src/lib/games/dungeon/pickup-loot-ownership-contract.test.js \
            src/lib/games/dungeon/pickup-runtime.test.js \
            src/lib/games/dungeon/world-runtime.test.js \
            src/lib/games/dungeon/player-intent-runtime.test.js \
            src/lib/games/dungeon/player-command-runtime.test.js \
            src/lib/games/dungeon/player-command-clock.test.js \
            src/lib/games/dungeon/player-replication-runtime.test.js \
            src/lib/games/dungeon/network-authority-snapshot-ownership.test.js \
            src/lib/games/dungeon/network-checkpoint-clock.test.js \
            src/lib/games/dungeon/network-wire-clock.test.js \
            src/lib/games/dungeon/coop-network-intent-wiring.test.js \
            src/lib/games/dungeon/network-foundation-contract.test.js \
            src/lib/games/dungeon/network-session-authority.test.js \
            src/lib/games/dungeon/network-reconnect-regression.test.js \
            src/lib/games/dungeon/network-runtime.test.js
