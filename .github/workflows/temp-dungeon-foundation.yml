name: temp-dungeon-foundation
on:
  push:
    branches: [fix/dungeon-foundation]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Pickup runtime tests
        working-directory: web
        run: node --test src/lib/games/dungeon/pickup-runtime.test.js
      - name: Map generator tests
        working-directory: web
        run: node --test src/lib/games/dungeon/map-generator.test.js
      - name: Progression tests
        working-directory: web
        run: node --test src/lib/games/dungeon/progression.test.js
      - name: Infinite runtime tests
        working-directory: web
        run: node --test src/lib/games/dungeon/infinite-runtime.test.js
      - name: Dungeon3 renderer tests
        working-directory: web
        run: node --test src/lib/games/dungeon/dungeon3-renderer.test.js
      - name: Full web tests
        working-directory: web
        run: npm test
      - name: Web build
        working-directory: web
        run: npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go tests
        run: go test ./...
