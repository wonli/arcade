name: temp-dungeon-foundation
on:
  push:
    branches: [fix/dungeon-foundation]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web tests
        working-directory: web
        run: npm ci && npm test
      - name: Web build
        working-directory: web
        run: npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go tests
        run: go test ./...
