name: Fix A11y Warnings

on:
  push:
    branches:
      - ci/fix-a11y-warnings

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      - name: Apply semantic accessibility fixes
        shell: bash
        env:
          EXPECTED_MAIN: c334fbc2a59baa0f61470b2b3aaa57e40f63a96a
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          python3 - <<'PY'
          from pathlib import Path

          chess = Path('web/src/lib/games/chess/ChessBoard.svelte')
          text = chess.read_text()
          old = '<div class="chess-wrap" onpointerdown={unlockAudio}>'
          new = '<svelte:window onpointerdown={unlockAudio} />\n\n<div class="chess-wrap">'
          if text.count(old) != 1:
              raise SystemExit('unexpected ChessBoard pointerdown markup')
          chess.write_text(text.replace(old, new, 1))

          editor = Path('web/src/routes/dungeon/editor/+page.svelte')
          text = editor.read_text()
          marker = '''  function dragMove(event) {\n'''
          helper = '''  function nudgeWeapon(event) {\n    if (!resolved) return\n    const step = event.shiftKey ? 5 : 1\n    if (event.key === 'ArrowLeft') { event.preventDefault(); updatePose('x', resolved.pose.x - step) }\n    else if (event.key === 'ArrowRight') { event.preventDefault(); updatePose('x', resolved.pose.x + step) }\n    else if (event.key === 'ArrowUp') { event.preventDefault(); updatePose('y', resolved.pose.y - step) }\n    else if (event.key === 'ArrowDown') { event.preventDefault(); updatePose('y', resolved.pose.y + step) }\n  }\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('unexpected Dungeon editor dragMove marker')
          text = text.replace(marker, helper + marker, 1)
          old = '''          <div class="weapon-origin" style={`left:${weaponX}px;top:${weaponY}px;transform:rotate(${resolved.pose.angle}deg)`} on:pointerdown={(event) => beginDrag('move', event)}>'''
          new = '''          <div class="weapon-origin" role="button" tabindex="0" aria-label="Move weapon; use arrow keys for fine adjustment" style={`left:${weaponX}px;top:${weaponY}px;transform:rotate(${resolved.pose.angle}deg)`} on:pointerdown={(event) => beginDrag('move', event)} on:keydown={nudgeWeapon}>'''
          if text.count(old) != 1:
              raise SystemExit('unexpected Dungeon editor weapon-origin markup')
          editor.write_text(text.replace(old, new, 1))
          PY
      - name: Run full regression suite with warning gate
        shell: bash
        run: |
          set -euo pipefail
          make test 2>&1 | tee /tmp/make-test.log
          if grep -F '[vite-plugin-svelte]' /tmp/make-test.log; then
            echo 'Svelte compiler warning remains' >&2
            exit 1
          fi
      - name: Commit verified fix branch
        shell: bash
        env:
          EXPECTED_MAIN: c334fbc2a59baa0f61470b2b3aaa57e40f63a96a
        run: |
          set -euo pipefail
          git add web/src/lib/games/chess/ChessBoard.svelte web/src/routes/dungeon/editor/+page.svelte
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git config user.name 'ideaa'
          git config user.email 'ideaa@qq.com'
          git commit -m 'fix: clear Svelte accessibility warnings'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git push origin HEAD:refs/heads/fix/a11y-main --force-with-lease
