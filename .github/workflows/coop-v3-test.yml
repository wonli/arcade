name: Dungeon Co-op V3 Test

on:
  push:
    branches:
      - feat/dungeon-coop-v3
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true
      - run: make test
