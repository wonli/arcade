name: temp dungeon achievement hud

on:
  push:
    branches:
      - feat/dungeon-achievement-hud

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vitest run src/lib/games/dungeon/hud-runtime.test.js
