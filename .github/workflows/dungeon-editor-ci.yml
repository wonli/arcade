name: Dungeon Editor CI

on:
  push:
    branches:
      - feat/dungeon-editor

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build

  editor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: >-
          node --test
          src/lib/games/dungeon/editor-config.test.js
          src/lib/games/dungeon/editor-runtime.test.js
          src/lib/games/dungeon/weapon-presentation.test.js
          src/lib/games/dungeon/weapon-visual-runtime.test.js
          src/lib/games/dungeon/weapon-vfx-runtime.test.js
