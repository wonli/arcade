name: temp dungeon portal dwell verification

on:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Portal dwell regression
        run: >-
          node --test
          src/lib/games/dungeon/portal-dwell.test.js
          src/lib/games/dungeon/backtrack-runtime.test.js
          src/lib/games/dungeon/scene.test.js
      - name: Production build
        run: npm run build
