name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test project
        run: make test

      - name: Upload dungeon tileset sheets
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-tileset-sheets
          path: |
            web/static/assets/dungeon-tileset/**/Tiled_files/walls_floor.png
            web/static/assets/dungeon-tileset/**/Tiled_files/Water_coasts_animation.png
            web/static/assets/dungeon-tileset/**/Tiled_files/Arches_columns.png
            web/static/assets/dungeon-tileset/**/Tiled_files/torches.png
            web/static/assets/dungeon-tileset/**/Tiled_files/chest_lever.png
          if-no-files-found: error
          retention-days: 1

      - name: Build project
        run: make build
