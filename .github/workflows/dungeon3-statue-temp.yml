name: Dungeon3 statue temp
on:
  push:
    branches:
      - fix/dungeon3-statue-real-geometry
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test web/src/lib/games/dungeon/dungeon3-statue-real-geometry.test.js
