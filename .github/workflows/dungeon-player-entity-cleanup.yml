name: Dungeon PlayerEntity Cleanup

on:
  push:
    branches: [ci/dungeon-player-entity-cleanup]

permissions:
  contents: write

jobs:
  green-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dungeon-coop-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      - name: Remove optional legacy player aliases
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('web/src/lib/games/dungeon')
          for name in ['infinite-runtime.js', 'pickup-runtime.js', 'weapon-vfx-runtime.js', 'weapon-visual-runtime.js']:
              path = root / name
              text = path.read_text()
              path.write_text(text.replace('scene?.playerState', 'scene?.localPlayer?.state'))
          PY
      - name: Upgrade legacy Dungeon test scenes to PlayerEntity fixtures
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('web/src/lib/games/dungeon')
          helper_import = "import { attachLegacyTestPlayer } from './test/player-fixture.js'\n"
          expr = r'[_$A-Za-z][_$A-Za-z0-9]*(?:\.[_$A-Za-z][_$A-Za-z0-9]*)*'
          installer = re.compile(rf'\b(install[A-Z][A-Za-z0-9_]*)\(({expr})(?=[,)])')
          scaler = re.compile(rf'\b(scalePlayerForProgress)\(({expr})(?=[,)])')
          alias_replacements = [
              ('.playerState', '.localPlayer.state'),
              ('.playerBar', '.localPlayer.bar'),
              ('.playerFacing', '.localPlayer.facing'),
              ('.playerMoving', '.localPlayer.moving'),
              ('.playerAttacking', '.localPlayer.attacking'),
              ('.lastAttackAt', '.localPlayer.lastAttackAt'),
              ('.skillReadyAt', '.localPlayer.skillReadyAt'),
              ('.lastContactAt', '.localPlayer.lastContactAt'),
          ]

          for path in sorted(root.glob('*.test.js')):
              if path.name in {'player-entity.test.js', 'scene-player-entity.test.js', 'player-entity-boundary.test.js'}:
                  continue
              text = path.read_text()
              before = text
              used_helper = [False]

              def wrap(match):
                  used_helper[0] = True
                  return f"{match.group(1)}(attachLegacyTestPlayer({match.group(2)})"

              text = installer.sub(wrap, text)
              text = scaler.sub(wrap, text)

              if path.name == 'pickup-runtime.test.js':
                  text = text.replace(
                      "  const scene = { playerState: { x: 48, y: 90 }, __dungeonSpatial: { getGeometry: () => geometry } }\n",
                      "  const scene = attachLegacyTestPlayer({ playerState: { x: 48, y: 90 }, __dungeonSpatial: { getGeometry: () => geometry } })\n",
                  )
                  text = text.replace(
                      "  const scene = { playerState: player, __dungeonSpatial: { getGeometry: () => geometry } }\n",
                      "  const scene = attachLegacyTestPlayer({ playerState: player, __dungeonSpatial: { getGeometry: () => geometry } })\n",
                  )
                  used_helper[0] = True

              if used_helper[0]:
                  for old, new in alias_replacements:
                      text = text.replace(old, new)
                  text = text.replace('scene.dead', 'scene.localPlayer.dead')
                  text = text.replace('scene.player', 'scene.localPlayer.actor')
                  text = text.replace('this.player', 'this.localPlayer.actor')
                  if helper_import not in text:
                      text = helper_import + text

              if path.name == 'room-anchors.test.js':
                  for old, new in alias_replacements:
                      text = text.replace(old, new)
                  text = text.replace('scene.player', 'scene.localPlayer.actor')

              if text != before:
                  path.write_text(text)
          PY
      - name: Verify alias boundary
        working-directory: web
        run: node --test src/lib/games/dungeon/player-entity-boundary.test.js
      - name: Run full regression
        run: make test
      - name: Commit green baseline
        run: |
          git config user.name ideaa
          git config user.email ideaa@qq.com
          git add web/src/lib/games/dungeon
          git commit -m 'refactor(dungeon): finish alias-free PlayerEntity baseline'
          git push origin HEAD:feat/dungeon-coop-foundation
