name: Dungeon PlayerEntity Cleanup

on:
  push:
    branches: [ci/dungeon-player-entity-cleanup]

jobs:
  boundary-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dungeon-coop-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Run PlayerEntity boundary test
        working-directory: web
        run: node --test src/lib/games/dungeon/player-entity-boundary.test.js
