name: Dungeon PlayerEntity Cleanup

on:
  push:
    branches: [ci/dungeon-player-entity-cleanup]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8c69344746759eaf61b55082b2581743bc7153f8
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      - name: Verify exact feature commit
        run: |
          test "$(git rev-parse HEAD)" = "8c69344746759eaf61b55082b2581743bc7153f8"
          make test
