<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Animated black hole preview">
  <defs>
    <radialGradient id="space" cx="50%" cy="48%" r="68%">
      <stop offset="0%" stop-color="#111812"/>
      <stop offset="32%" stop-color="#090d0a"/>
      <stop offset="72%" stop-color="#050607"/>
      <stop offset="100%" stop-color="#020303"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c1ff56" stop-opacity=".55"/>
      <stop offset="36%" stop-color="#8bcf45" stop-opacity=".23"/>
      <stop offset="72%" stop-color="#334626" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#c1ff56" stop-opacity="0"/>
      <stop offset="18%" stop-color="#c1ff56" stop-opacity=".26"/>
      <stop offset="43%" stop-color="#f4f0e8" stop-opacity=".92"/>
      <stop offset="56%" stop-color="#c1ff56" stop-opacity=".95"/>
      <stop offset="84%" stop-color="#6fa43c" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#c1ff56" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mist" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="30%" stop-color="#33412f" stop-opacity=".04"/>
      <stop offset="50%" stop-color="#8bb760" stop-opacity=".22"/>
      <stop offset="72%" stop-color="#c1ff56" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur40" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blur18" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0.6 0 0 0 0.35  0 0.9 0 0 0.55  0 0 0.2 0 0.08  0 0 0 0.85 0"/>
    </filter>
    <clipPath id="frame">
      <rect width="1600" height="900"/>
    </clipPath>
  </defs>

  <style>
    .drift-a{animation:driftA 18s ease-in-out infinite alternate}
    .drift-b{animation:driftB 24s ease-in-out infinite alternate}
    .pulse{animation:pulse 5.5s ease-in-out infinite}
    .twinkle{animation:twinkle 4.2s ease-in-out infinite}
    @keyframes driftA{from{transform:translate(-18px,8px)}to{transform:translate(22px,-10px)}}
    @keyframes driftB{from{transform:translate(14px,-8px)}to{transform:translate(-20px,14px)}}
    @keyframes pulse{0%,100%{opacity:.74}50%{opacity:1}}
    @keyframes twinkle{0%,100%{opacity:.18}50%{opacity:.7}}
    @media (prefers-reduced-motion: reduce){
      .drift-a,.drift-b,.pulse,.twinkle{animation:none!important}
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="url(#space)"/>

    <g opacity=".36" class="drift-a">
      <ellipse cx="800" cy="430" rx="610" ry="235" fill="url(#mist)" filter="url(#blur40)" transform="rotate(-9 800 430)"/>
      <ellipse cx="820" cy="470" rx="500" ry="165" fill="none" stroke="#c1ff56" stroke-opacity=".07" stroke-width="52" filter="url(#blur40)" transform="rotate(-10 820 470)"/>
    </g>

    <g opacity=".65" class="drift-b">
      <path d="M180 520 C430 350 590 325 800 420 C1020 520 1180 485 1425 305" fill="none" stroke="#c1ff56" stroke-opacity=".08" stroke-width="86" stroke-linecap="round" filter="url(#blur40)"/>
      <path d="M220 610 C470 430 630 405 815 480 C1005 558 1210 540 1390 410" fill="none" stroke="#d9e7d2" stroke-opacity=".055" stroke-width="62" stroke-linecap="round" filter="url(#blur40)"/>
    </g>

    <ellipse cx="800" cy="450" rx="405" ry="405" fill="url(#halo)" filter="url(#blur40)" class="pulse"/>

    <g transform="rotate(-10 800 450)">
      <ellipse cx="800" cy="450" rx="445" ry="128" fill="none" stroke="url(#ring)" stroke-width="34" stroke-linecap="round" filter="url(#blur18)" opacity=".6">
        <animateTransform attributeName="transform" type="rotate" from="0 800 450" to="360 800 450" dur="18s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="800" cy="450" rx="400" ry="108" fill="none" stroke="url(#ring)" stroke-width="13" stroke-linecap="round" filter="url(#glow)" opacity=".92">
        <animateTransform attributeName="transform" type="rotate" from="360 800 450" to="0 800 450" dur="11s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="800" cy="450" rx="350" ry="82" fill="none" stroke="#f4f0e8" stroke-opacity=".58" stroke-width="4" stroke-dasharray="5 18 2 26" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" from="0 800 450" to="360 800 450" dur="8s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <g opacity=".72">
      <path d="M360 485 C540 370 655 352 800 418 C940 482 1080 470 1240 375" fill="none" stroke="#c1ff56" stroke-opacity=".24" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
      <path d="M410 535 C585 425 680 410 818 466 C945 518 1085 505 1215 432" fill="none" stroke="#f4f0e8" stroke-opacity=".18" stroke-width="5" stroke-linecap="round"/>
    </g>

    <circle cx="800" cy="450" r="169" fill="#020303" stroke="#0b0d10" stroke-width="22"/>
    <circle cx="800" cy="450" r="176" fill="none" stroke="#c1ff56" stroke-opacity=".18" stroke-width="8" filter="url(#softGlow)" class="pulse"/>
    <circle cx="800" cy="450" r="158" fill="#000"/>

    <g fill="#c1ff56" opacity=".35">
      <circle cx="495" cy="272" r="2.4" class="twinkle"/>
      <circle cx="1112" cy="278" r="1.8" class="twinkle" style="animation-delay:.8s"/>
      <circle cx="1220" cy="546" r="2.2" class="twinkle" style="animation-delay:1.6s"/>
      <circle cx="386" cy="565" r="1.7" class="twinkle" style="animation-delay:2.2s"/>
      <circle cx="1038" cy="660" r="1.6" class="twinkle" style="animation-delay:1.1s"/>
    </g>

    <rect x="0" y="0" width="1600" height="900" fill="none" stroke="#0b0d10" stroke-opacity=".65" stroke-width="120"/>
  </g>
</svg>
